{% extends "base.html" %}

{% block content %}
<h1>Iniciar sesión</h1>
<p class="subtitulo">Accede al módulo de consulta y limpieza de instrumentos</p>

<div class="tarjeta" style="max-width: 380px; margin: 2rem auto;">
    <form>
        <label for="usuario">Usuario</label>
        <input class="campo" type="text" id="usuario" name="usuario" placeholder="usuario@ejemplo.com">

        <label for="contrasena">Contraseña</label>
        <input class="campo" type="password" id="contrasena" name="contrasena" placeholder="••••••••">

        <button class="boton" type="submit" style="width: 100%;">Entrar</button>
    </form>
</div>
